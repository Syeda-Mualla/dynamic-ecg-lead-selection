[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-ecg-lead-selection"
version = "0.1.0"
description = "Quality-aware dynamic ECG lead-selection research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Research code; dataset licensing is separate"}
authors = [{name = "Research Project"}]
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "wfdb>=4.1,<5",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
  "tensorboard>=2.16,<3",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
